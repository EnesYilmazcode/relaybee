name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `check` is typecheck, the smoke suite, the Upstash path, the HTTP e2e
      # run, and the adversary suite. All four boot the real handlers locally,
      # need no credentials and make no model calls, so all four can gate every
      # push to main, which is what Vercel deploys to production.
      - run: npm run check
      # Called out separately because of what it is rather than what it costs:
      # it mints its own keys and attacks the service as a stranger. Every check
      # in it passes only when an attack FAILS. See test/adversary.mts.
      - run: npm run test:adversary
